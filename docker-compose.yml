version: "3.9"

# HealthPulse AI - full local stack
#   docker compose up --build
#   frontend  -> http://localhost:3000
#   backend   -> http://localhost:8000/docs

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: healthpulse-db
    environment:
      POSTGRES_DB: healthpulse
      POSTGRES_USER: healthpulse
      POSTGRES_PASSWORD: healthpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthpulse -d healthpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: healthpulse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: healthpulse-backend
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DATABASE_URL: postgresql+psycopg2://healthpulse:healthpulse@db:5432/healthpulse
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      DOCUMENT_STORAGE_DIR: /app/storage/documents
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: healthpulse-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  backend_storage:
